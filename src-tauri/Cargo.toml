[package]
name = "niazi-mobile-mart"
version = "1.2.17"
description = "Niazi Mobile Mart - Desktop ERP & POS"
authors = ["Niazi Mobile Mart"]
edition = "2021"

[lib]
name = "niazi_mobile_mart_lib"
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "niazi-mobile-mart"
path = "src/main.rs"

[[bin]]
name = "niazi-server"
path = "src/bin/server.rs"

[build-dependencies]
tauri-build = { version = "2.0.5", features = [] }

[dependencies]
tauri = { version = "2.1.1", features = ["devtools"] }
tauri-plugin-opener = "2.0.3"
tauri-plugin-updater = "2.1.1"
tauri-plugin-dialog = "2.0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.43", features = ["sync", "rt", "rt-multi-thread", "macros", "time", "net", "signal"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tracing-appender = "0.2"
argon2 = "0.5"
rand_core = { version = "0.6", features = ["std"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled", "chrono", "uuid"] }
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-native-tls", "chrono", "uuid", "migrate"] }
jsonwebtoken = "9.3"
reqwest = { version = "0.12", features = ["json"] }
