<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#0a1215" />
      <stop offset="60%" stop-color="#050809" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <!-- Outer Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Brand Cyan/Teal Gradient -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#33c9cf" />
      <stop offset="50%" stop-color="#00b4bb" />
      <stop offset="100%" stop-color="#00474c" />
    </linearGradient>

    <!-- Red Swoosh Gradient -->
    <linearGradient id="redGrad" x1="20%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff334b" />
      <stop offset="50%" stop-color="#e61e2a" />
      <stop offset="100%" stop-color="#990b14" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Outer Ring Accent with Teal Glow -->
  <circle cx="250" cy="250" r="242" fill="none" stroke="url(#tealGrad)" stroke-width="4" opacity="0.6" filter="url(#glow)" />
  <circle cx="250" cy="250" r="236" fill="url(#bgGrad)" stroke="#1a2e33" stroke-width="2" filter="url(#dropShadow)" />

  <!-- Iconic Dynamic Crescent Arc (Dual Accent: Red & Teal) -->
  <!-- Inner subtle teal guide arc -->
  <path d="M 120 180 A 185 185 0 0 1 380 130" fill="none" stroke="url(#tealGrad)" stroke-width="4" stroke-linecap="round" opacity="0.4" />
  <path d="M 100 320 A 185 185 0 0 0 320 400" fill="none" stroke="url(#tealGrad)" stroke-width="4" stroke-linecap="round" opacity="0.4" />

  <!-- Main Sweeping Dynamic Swoosh Arc -->
  <path d="M 115 225 C 130 110, 230 45, 345 75 C 435 98, 470 185, 455 275 C 440 370, 360 445, 260 445 C 190 445, 130 410, 105 345 C 135 390, 205 425, 275 420 C 370 410, 435 340, 440 250 C 445 160, 395 85, 305 70 C 215 55, 140 120, 115 225 Z" 
        fill="url(#redGrad)" filter="url(#dropShadow)" />

  <!-- Typography: NMM -->
  <g id="letters" filter="url(#dropShadow)" transform="translate(0, 15)">
    <!-- First 'N' in clean crisp modern white -->
    <path d="M 90 285 L 90 175 C 90 162, 98 152, 112 152 C 122 152, 129 157, 135 167 L 175 238 L 175 175 C 175 162, 183 152, 197 152 C 211 152, 219 162, 219 175 L 219 285 C 219 298, 211 308, 197 308 C 187 308, 180 303, 174 293 L 134 222 L 134 285 C 134 298, 126 308, 112 308 C 98 308, 90 298, 90 285 Z" 
          fill="#FFFFFF" />

    <!-- Center 'M' in vibrant energetic Crimson Red -->
    <path d="M 210 285 L 210 175 C 210 162, 219 152, 233 152 C 242 152, 249 157, 255 166 L 275 204 L 295 166 C 301 157, 308 152, 317 152 C 331 152, 340 162, 340 175 L 340 285 C 340 298, 331 308, 318 308 C 304 308, 296 298, 296 285 L 296 218 L 282 245 C 279 251, 271 251, 268 245 L 254 218 L 254 285 C 254 298, 246 308, 232 308 C 218 308, 210 298, 210 285 Z" 
          fill="url(#redGrad)" />

    <!-- Third 'M' in clean crisp modern white -->
    <path d="M 330 285 L 330 175 C 330 162, 339 152, 353 152 C 362 152, 369 157, 375 166 L 395 204 L 415 166 C 421 157, 428 152, 437 152 C 451 152, 460 162, 460 175 L 460 285 C 460 298, 451 308, 438 308 C 424 308, 416 298, 416 285 L 416 218 L 402 245 C 399 251, 391 251, 388 245 L 374 218 L 374 285 C 374 298, 366 308, 352 308 C 338 308, 330 298, 330 285 Z" 
          fill="#FFFFFF" />
  </g>

  <!-- Small Brand Subtitle Tag -->
  <text x="250" y="360" text-anchor="middle" font-family="'Segoe UI', 'Inter', -apple-system, sans-serif" font-size="16" font-weight="700" letter-spacing="4" fill="#00b4bb" opacity="0.9">
    NIAZI MOBILE MART
  </text>
</svg>
