steps:
  # ---------------------------------------------------------------------------
  # Step 0: Pull Previous Container Image for Layer Caching
  # ---------------------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Pull Cache Image'
    entrypoint: 'bash'
    args:
      - '-c'
      - 'docker pull asia-south1-docker.pkg.dev/$PROJECT_ID/niazi-repo/niazi-server:latest || true'

  # ---------------------------------------------------------------------------
  # Step 1: Build Multi-Stage Production Container Image
  # ---------------------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build Container Image'
    args:
      - 'build'
      - '--cache-from'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/niazi-repo/niazi-server:latest'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/niazi-repo/niazi-server:$TAG_NAME'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/niazi-repo/niazi-server:$COMMIT_SHA'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/niazi-repo/niazi-server:latest'
      - '.'

  # ---------------------------------------------------------------------------
  # Step 2: Push Release Tag, Commit SHA & Latest Images to Artifact Registry
  # ---------------------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push Release Tag Image'
    args:
      - 'push'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/niazi-repo/niazi-server:$TAG_NAME'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push Commit SHA Image'
    args:
      - 'push'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/niazi-repo/niazi-server:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push Latest Image'
    args:
      - 'push'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/niazi-repo/niazi-server:latest'

  # ---------------------------------------------------------------------------
  # Step 3: Deploy Service to Google Cloud Run (Using Immutable Commit SHA)
  # ---------------------------------------------------------------------------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Deploy Cloud Run Service'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'niazi-server'
      - '--image=asia-south1-docker.pkg.dev/$PROJECT_ID/niazi-repo/niazi-server:$COMMIT_SHA'
      - '--region=asia-south1'
      - '--platform=managed'
      - '--port=8080'
      - '--cpu=1'
      - '--memory=1Gi'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--vpc-connector=niazi-vpc-conn'
      - '--vpc-egress=private-ranges-only'
      - '--allow-unauthenticated'
      - '--set-secrets=DATABASE_URL=DATABASE_URL:latest'
      - '--set-secrets=JWT_PRIVATE_KEY=JWT_PRIVATE_KEY:latest'
      - '--set-secrets=JWT_PUBLIC_KEY=JWT_PUBLIC_KEY:latest'

images:
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/niazi-repo/niazi-server:$TAG_NAME'
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/niazi-repo/niazi-server:$COMMIT_SHA'
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/niazi-repo/niazi-server:latest'

# The default Cloud Build machine (e2-standard-2) is used: no machineType is set.
# Builds are slower on 2 vCPUs, so the build timeout is raised to 2 hours.
timeout: '7200s'

options:
  logging: CLOUD_LOGGING_ONLY
